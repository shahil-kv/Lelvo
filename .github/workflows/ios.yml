name: iOS

# Everyday pushes: one lane (newest Xcode on the xcode-27 image), unit tests, IPA artifact.
# Full runs (tags v*, or "Run workflow" with full = true): both lanes, UI tests, and a GitHub Release on tags.
# Docs-only changes (*.md) never trigger a build.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      full:
        description: "Full run: both Xcode lanes + UI tests"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.p.outputs.full }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - id: p
        run: |
          FULL=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || [[ "${{ inputs.full }}" == "true" ]]; then FULL=true; fi
          XC27='{"runner":"xcode-27","label":"xcode-27","experimental":false}'
          LATEST='{"runner":"macos-latest","label":"macos-latest","experimental":true}'
          if [ "$FULL" = true ]; then MATRIX="{\"include\":[$XC27,$LATEST]}"; else MATRIX="{\"include\":[$XC27]}"; fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "full=$FULL matrix=$MATRIX"

  build:
    name: Build (${{ matrix.label }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The secondary lane must not block the main one.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      FULL: ${{ needs.plan.outputs.full }}
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        id: xcode
        run: |
          set -euo pipefail
          # Resolve symlinks (Xcode_27.2.app may point at a beta), skip betas, take the newest version.
          CANDIDATES=$(for x in /Applications/Xcode*.app; do
              real=$(cd "$x" && pwd -P)
              ver=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$real/Contents/Info.plist" 2>/dev/null || echo 0)
              echo "$ver $real"
            done | sort -u)
          echo "$CANDIDATES"
          XCODE=$(echo "$CANDIDATES" | grep -viE 'beta' | sort -V | tail -1 | cut -d' ' -f2-)
          [ -n "$XCODE" ] || XCODE=$(echo "$CANDIDATES" | sort -V | tail -1 | cut -d' ' -f2-)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "build=$(xcodebuild -version | tail -1 | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Built-in Telegram app keys (optional repository secrets)
        env:
          TD_API_ID: ${{ secrets.TD_API_ID }}
          TD_API_HASH: ${{ secrets.TD_API_HASH }}
        run: |
          if [ -n "$TD_API_ID" ] && [ -n "$TD_API_HASH" ]; then
            printf 'TD_API_ID = %s\nTD_API_HASH = %s\n' "$TD_API_ID" "$TD_API_HASH" > Config/Secrets.xcconfig
            echo "Telegram app keys built in"
          else
            echo "No TD_API_ID / TD_API_HASH secrets: sign-in will ask for the keys"
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      # TDLib (~350 MB download) and TDLibKit (~66k lines) dominate build time: keep the resolved
      # packages and their compiled products between runs.
      - name: Cache Swift packages and build products
        uses: actions/cache@v4
        with:
          path: |
            ios/build/SourcePackages
            ios/build/DerivedData
          key: ios-${{ matrix.label }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('ios/project.yml', 'ios/CloudGalleryCore/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ios-${{ matrix.label }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('ios/project.yml', 'ios/CloudGalleryCore/Package.swift') }}-
            ios-${{ matrix.label }}-${{ steps.xcode.outputs.build }}-

      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          SDKVER=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "Simulator SDK $SDKVER"
          UDID=$(xcrun simctl list devices available -j | SDKVER="$SDKVER" python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)["devices"]
          limit = tuple(int(p) for p in os.environ["SDKVER"].split("."))
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(p) for p in runtime.rsplit("iOS-", 1)[-1].split("-") if p.isdigit())
              if version[:2] > limit[:2]:
                  continue  # runtime newer than this Xcode supports
              for d in devices:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      if best is None or version > best[0]:
                          best = (version, d["udid"], d["name"])
          print(best[1] if best else "")
          ')
          if [ -z "$UDID" ]; then echo "No iPhone simulator found"; xcrun simctl list; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Run tests (UI tests only on full runs)
        run: |
          SKIP=""
          if [ "$FULL" != true ]; then SKIP="-skip-testing:CloudGalleryUITests"; fi
          xcodebuild test \
            -project CloudGallery.xcodeproj \
            -scheme CloudGallery \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/TestResults.xcresult \
            $SKIP \
            CODE_SIGNING_ALLOWED=NO \
            > build-test.log 2>&1 || { grep -E "error:|✘|failed" build-test.log | head -100; tail -80 build-test.log; exit 1; }
          grep -E "✔ Test run|✘|Executed|\*\* TEST" build-test.log || tail -20 build-test.log

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project CloudGallery.xcodeproj \
            -scheme CloudGallery \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/CloudGallery.xcarchive \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build-archive.log 2>&1 || { grep -E "error:" build-archive.log | head -100; tail -80 build-archive.log; exit 1; }
          grep -E "\*\* ARCHIVE" build-archive.log

      - name: Package CloudGallery.ipa
        run: |
          set -euo pipefail
          APP=build/CloudGallery.xcarchive/Products/Applications/CloudGallery.app
          test -d "$APP"
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry CloudGallery.ipa Payload)
          ls -lh build/CloudGallery.ipa
          shasum -a 256 build/CloudGallery.ipa | tee build/CloudGallery.ipa.sha256

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logs-${{ matrix.label }}
          path: |
            ios/build-*.log
            ios/build/TestResults.xcresult
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: CloudGallery-ipa-${{ matrix.label }}
          path: |
            ios/build/CloudGallery.ipa
            ios/build/CloudGallery.ipa.sha256

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && always()
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: CloudGallery-ipa-*
          path: artifacts

      - name: Choose IPA (newest SDK that built)
        id: pick
        run: |
          find artifacts -type f | sort
          # With one artifact, download-artifact puts files directly in artifacts/ (no per-artifact folder).
          for dir in artifacts/CloudGallery-ipa-xcode-27 artifacts/CloudGallery-ipa-macos-latest artifacts; do
            if [ -f "$dir/CloudGallery.ipa" ]; then
              echo "dir=$dir" >> "$GITHUB_OUTPUT"
              echo "label=$(basename "$dir" | sed 's/CloudGallery-ipa-//')" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No IPA was built"; exit 1

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR="${{ steps.pick.outputs.dir }}"
          NOTES="Unsigned iOS build of CloudGallery (built on the ${{ steps.pick.outputs.label }} runner). Install with SideStore, AltStore or Sideloadly using your Apple ID; see ios/README.md for Telegram sign-in setup. Requires iOS 17 or later."
          PRE=""
          case "${GITHUB_REF_NAME}" in *-*) PRE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" "$DIR/CloudGallery.ipa" "$DIR/CloudGallery.ipa.sha256" $PRE \
            --repo "${GITHUB_REPOSITORY}" --title "CloudGallery iOS ${GITHUB_REF_NAME}" --notes "$NOTES" \
            || gh release upload "${GITHUB_REF_NAME}" "$DIR/CloudGallery.ipa" "$DIR/CloudGallery.ipa.sha256" --clobber --repo "${GITHUB_REPOSITORY}"
