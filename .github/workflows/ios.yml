name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, archive and package unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          # Prefer the newest stable Xcode; fall back to the newest of any kind (beta/RC).
          STABLE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc|release_candidate' | sort -V | tail -1 || true)
          ANY=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          XCODE=${STABLE:-$ANY}
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(p) for p in runtime.rsplit("iOS-", 1)[-1].split("-") if p.isdigit())
              for d in devices:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      if best is None or version > best[0]:
                          best = (version, d["udid"], d["name"])
          print(best[1] if best else "")
          ')
          if [ -z "$UDID" ]; then echo "No iPhone simulator found"; xcrun simctl list; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project CloudGallery.xcodeproj \
            -scheme CloudGallery \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > build-test.log 2>&1 || { grep -E "error:|✘|failed" build-test.log | head -100; tail -80 build-test.log; exit 1; }
          grep -E "✔ Test run|✘|Executed|\*\* TEST" build-test.log || tail -20 build-test.log

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project CloudGallery.xcodeproj \
            -scheme CloudGallery \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/CloudGallery.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build-archive.log 2>&1 || { grep -E "error:" build-archive.log | head -100; tail -80 build-archive.log; exit 1; }
          grep -E "\*\* ARCHIVE" build-archive.log

      - name: Package CloudGallery.ipa
        run: |
          set -euo pipefail
          APP=build/CloudGallery.xcarchive/Products/Applications/CloudGallery.app
          test -d "$APP"
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry CloudGallery.ipa Payload)
          ls -lh build/CloudGallery.ipa
          shasum -a 256 build/CloudGallery.ipa | tee build/CloudGallery.ipa.sha256

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ios/build-*.log
            ios/build/TestResults.xcresult
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudGallery-ipa
          path: |
            ios/build/CloudGallery.ipa
            ios/build/CloudGallery.ipa.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/CloudGallery.ipa build/CloudGallery.ipa.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CloudGallery iOS ${GITHUB_REF_NAME}" \
            --notes "Unsigned iOS build of CloudGallery. Install with Sideloadly or AltStore using your Apple ID (see ios/README.md). Requires iOS 17 or later." \
            || gh release upload "${GITHUB_REF_NAME}" build/CloudGallery.ipa build/CloudGallery.ipa.sha256 --clobber --repo "${GITHUB_REPOSITORY}"
