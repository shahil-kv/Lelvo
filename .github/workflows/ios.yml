name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The Xcode 27 image is a GitHub preview; it must not block the stable build.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: macos-latest
            experimental: false
          - runner: xcode-27
            label: xcode-27
            experimental: true
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          # Resolve symlinks (Xcode_27.2.app may point at a beta), skip betas, take the newest version.
          CANDIDATES=$(for x in /Applications/Xcode*.app; do
              real=$(cd "$x" && pwd -P)
              ver=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$real/Contents/Info.plist" 2>/dev/null || echo 0)
              echo "$ver $real"
            done | sort -u)
          echo "$CANDIDATES"
          XCODE=$(echo "$CANDIDATES" | grep -viE 'beta' | sort -V | tail -1 | cut -d' ' -f2-)
          [ -n "$XCODE" ] || XCODE=$(echo "$CANDIDATES" | sort -V | tail -1 | cut -d' ' -f2-)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          SDKVER=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "Simulator SDK $SDKVER"
          UDID=$(xcrun simctl list devices available -j | SDKVER="$SDKVER" python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)["devices"]
          limit = tuple(int(p) for p in os.environ["SDKVER"].split("."))
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(p) for p in runtime.rsplit("iOS-", 1)[-1].split("-") if p.isdigit())
              if version[:2] > limit[:2]:
                  continue  # runtime newer than this Xcode supports
              for d in devices:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      if best is None or version > best[0]:
                          best = (version, d["udid"], d["name"])
          print(best[1] if best else "")
          ')
          if [ -z "$UDID" ]; then echo "No iPhone simulator found"; xcrun simctl list; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project CloudGallery.xcodeproj \
            -scheme CloudGallery \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > build-test.log 2>&1 || { grep -E "error:|✘|failed" build-test.log | head -100; tail -80 build-test.log; exit 1; }
          grep -E "✔ Test run|✘|Executed|\*\* TEST" build-test.log || tail -20 build-test.log

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project CloudGallery.xcodeproj \
            -scheme CloudGallery \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/CloudGallery.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build-archive.log 2>&1 || { grep -E "error:" build-archive.log | head -100; tail -80 build-archive.log; exit 1; }
          grep -E "\*\* ARCHIVE" build-archive.log

      - name: Package CloudGallery.ipa
        run: |
          set -euo pipefail
          APP=build/CloudGallery.xcarchive/Products/Applications/CloudGallery.app
          test -d "$APP"
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry CloudGallery.ipa Payload)
          ls -lh build/CloudGallery.ipa
          shasum -a 256 build/CloudGallery.ipa | tee build/CloudGallery.ipa.sha256

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logs-${{ matrix.label }}
          path: |
            ios/build-*.log
            ios/build/TestResults.xcresult
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: CloudGallery-ipa-${{ matrix.label }}
          path: |
            ios/build/CloudGallery.ipa
            ios/build/CloudGallery.ipa.sha256

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: CloudGallery-ipa-*
          path: artifacts

      - name: Choose IPA (newest SDK that built)
        id: pick
        run: |
          ls -R artifacts
          for label in xcode-27 macos-latest; do
            if [ -f "artifacts/CloudGallery-ipa-$label/CloudGallery.ipa" ]; then
              echo "dir=artifacts/CloudGallery-ipa-$label" >> "$GITHUB_OUTPUT"
              echo "label=$label" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No IPA was built"; exit 1

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR="${{ steps.pick.outputs.dir }}"
          NOTES="Unsigned iOS build of CloudGallery (built on the ${{ steps.pick.outputs.label }} runner). Install with Sideloadly or AltStore using your Apple ID; see ios/README.md. Requires iOS 17 or later."
          PRE=""
          case "${GITHUB_REF_NAME}" in *-*) PRE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" "$DIR/CloudGallery.ipa" "$DIR/CloudGallery.ipa.sha256" $PRE \
            --repo "${GITHUB_REPOSITORY}" --title "CloudGallery iOS ${GITHUB_REF_NAME}" --notes "$NOTES" \
            || gh release upload "${GITHUB_REF_NAME}" "$DIR/CloudGallery.ipa" "$DIR/CloudGallery.ipa.sha256" --clobber --repo "${GITHUB_REPOSITORY}"
