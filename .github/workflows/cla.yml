name: CLA

# Asks first-time contributors to sign CLA.md by commenting, and records signatures in the `cla-signatures` branch.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: shahil-kv,dependabot[bot],github-actions[bot],coderabbitai[bot]
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            (it keeps Lelvo GPL-3.0 and lets it be published on the App Store) and sign it by commenting
            with exactly the sentence below. You only do this once.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
