name: Release

run-name: "${{ inputs.app }} ${{ inputs.version }} (${{ inputs.channel }}) #${{ github.run_number }}"

# Actions → Release → Run workflow. Pick the app, the channel and the version; everything else is automatic:
#   build number   = this workflow's run number (always increases, never collides)
#   beta version   = <version>-beta.<run number>, published as a pre-release
#   tag            = ios-v<version> / macos-v<version> (with the beta suffix for betas)
#   front page     = v<version>, the release the repository shows, with the installers people download
#   release notes  = merged pull requests since the last release, grouped by label (.github/release.yml)
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app
        type: choice
        options: [ios, macos, both]
        default: both
      channel:
        description: Release channel
        type: choice
        options: [beta, stable]
        default: beta
      version:
        description: "Version without suffix, e.g. 0.2.0"
        type: string
        required: true
      testflight:
        # Off by default: App Store Connect has its own version train, and an upload can't be taken back.
        description: Also upload the iPhone build to TestFlight
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Release from main only (this run is on $GITHUB_REF)."; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 0.2.0, got '$VERSION'."; exit 1; }
          if [ "$CHANNEL" = beta ]; then FULL="$VERSION-beta.$GITHUB_RUN_NUMBER"; PRE=true; else FULL="$VERSION"; PRE=false; fi
          { echo "version=$FULL"; echo "build=$GITHUB_RUN_NUMBER"; echo "prerelease=$PRE"; } >> "$GITHUB_OUTPUT"
          echo "Releasing $FULL (build $GITHUB_RUN_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

  ios:
    needs: plan
    if: inputs.app == 'ios' || inputs.app == 'both'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 60
    env:
      TAG: ios-v${{ needs.plan.outputs.version }}
      # App Store Connect API key (docs/RELEASING.md → TestFlight). Without these the TestFlight step is skipped.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Refuse an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: "! gh release view \"$TAG\" --repo \"$GITHUB_REPOSITORY\" >/dev/null 2>&1 || { echo \"::error::$TAG already exists.\"; exit 1; }"
      - uses: ./.github/actions/setup
        with:
          td-api-id: ${{ secrets.TD_API_ID }}
          td-api-hash: ${{ secrets.TD_API_HASH }}
      - name: Archive (unsigned)
        run: |
          xcodebuild archive -project Lelvo.xcodeproj -scheme Lelvo -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Lelvo.xcarchive \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ needs.plan.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/archive.log 2>&1 || { grep -E "error:" build/archive.log | head -50; tail -60 build/archive.log; exit 1; }
          grep -E "\*\* ARCHIVE" build/archive.log
      - name: Package Lelvo.ipa
        run: |
          set -euo pipefail
          APP=build/Lelvo.xcarchive/Products/Applications/Lelvo.app
          test -f "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" -c "Print CFBundleVersion" "$APP/Info.plist"
          rm -rf build/Payload && mkdir -p build/Payload && cp -R "$APP" build/Payload/
          (cd build && zip -qry Lelvo.ipa Payload)
          shasum -a 256 build/Lelvo.ipa | tee build/Lelvo.ipa.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: lelvo-ios
          path: build/Lelvo.ipa
          if-no-files-found: error
      - name: Upload to TestFlight
        if: inputs.testflight && env.ASC_KEY_ID != '' && env.APPLE_TEAM_ID != ''
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          # Xcode signs with the team's cloud-managed distribution certificate, using the API key.
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project Lelvo.xcodeproj -scheme Lelvo -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Lelvo-signed.xcarchive \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ needs.plan.outputs.build }}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic "${AUTH[@]}" \
            > build/archive-signed.log 2>&1 || { grep -E "error:" build/archive-signed.log | head -50; tail -60 build/archive-signed.log; exit 1; }
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Lelvo-signed.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export "${AUTH[@]}" \
            > build/upload.log 2>&1 || { grep -E "error:|Error" build/upload.log | head -50; tail -60 build/upload.log; exit 1; }
          echo "Uploaded build ${{ needs.plan.outputs.build }} to App Store Connect. It appears in TestFlight after Apple's processing (10-30 minutes)." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          PRE=""; [ "${{ needs.plan.outputs.prerelease }}" = true ] && PRE="--prerelease"
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[].tagName | select(startswith("ios-v"))][0] // empty')
          START=""; [ -n "$LAST" ] && START="--notes-start-tag $LAST"
          gh release create "$TAG" build/Lelvo.ipa build/Lelvo.ipa.sha256 --target "$GITHUB_SHA" $PRE $START \
            --title "Lelvo for iPhone $VERSION" --generate-notes \
            --notes "Unsigned iOS build for sideloading (README → Install). iOS 17 or later. Build ${{ needs.plan.outputs.build }}."

  macos:
    needs: plan
    if: inputs.app == 'macos' || inputs.app == 'both'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 120
    env:
      TAG: macos-v${{ needs.plan.outputs.version }}
      # Developer ID certificate (base64 .p12) and the App Store Connect API key (docs/RELEASING.md → Mac signing).
      # Without them the app ships ad-hoc signed and macOS asks users to allow it in Privacy & Security.
      MAC_DEVID_P12: ${{ secrets.MAC_DEVID_P12 }}
      MAC_DEVID_P12_PASSWORD: ${{ secrets.MAC_DEVID_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7
      - name: Refuse an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: "! gh release view \"$TAG\" --repo \"$GITHUB_REPOSITORY\" >/dev/null 2>&1 || { echo \"::error::$TAG already exists.\"; exit 1; }"
      - uses: ./.github/actions/setup
        with:
          td-api-id: ${{ secrets.TD_API_ID }}
          td-api-hash: ${{ secrets.TD_API_HASH }}
      - name: Build (Release, Apple silicon and Intel)
        run: |
          xcodebuild build -project Lelvo.xcodeproj -scheme LelvoMac -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ needs.plan.outputs.build }}" \
            > build/mac.log 2>&1 || { grep -E "error:" build/mac.log | head -50; tail -60 build/mac.log; exit 1; }
          tail -1 build/mac.log
      - name: Sign with Developer ID and notarize the app
        if: env.MAC_DEVID_P12 != '' && env.ASC_KEY_ID != ''
        run: |
          set -euo pipefail
          APP=build/DerivedData/Build/Products/Release/Lelvo.app
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(uuidgen)
          printf '%s' "$MAC_DEVID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$MAC_DEVID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          # Lets codesign use the key without the keychain prompt a CI runner can't answer.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain
          ID=$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$ID" ] || { echo "::error::MAC_DEVID_P12 holds no Developer ID Application identity."; exit 1; }
          # Inside out, without --deep: --deep would put the app's entitlements on the embedded frameworks too.
          find "$APP/Contents/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 \
            | xargs -0 -I{} codesign --force --options runtime --timestamp --sign "$ID" {}
          codesign --force --options runtime --timestamp --entitlements macOS/LelvoMac.entitlements --sign "$ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          NOTARY=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${NOTARY[@]}" --wait --timeout 60m --output-format json \
            | tee "$RUNNER_TEMP/notary.json"
          if [ "$(plutil -extract status raw "$RUNNER_TEMP/notary.json")" != Accepted ]; then
            xcrun notarytool log "$(plutil -extract id raw "$RUNNER_TEMP/notary.json")" "${NOTARY[@]}" || true
            echo "::error::Apple did not accept the app for notarization (log above)."; exit 1
          fi
          xcrun stapler staple "$APP"
          spctl -a -vv -t exec "$APP"
          echo "MAC_SIGN_ID=$ID" >> "$GITHUB_ENV"
      - name: Package Lelvo-mac.zip
        run: |
          set -euo pipefail
          APP=build/DerivedData/Build/Products/Release/Lelvo.app
          test -f "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          lipo -archs "$APP/Contents/MacOS/Lelvo"
          ditto -c -k --keepParent "$APP" build/Lelvo-mac.zip
          shasum -a 256 build/Lelvo-mac.zip | tee build/Lelvo-mac.zip.sha256
      - name: Package Lelvo.dmg
        run: |
          set -euo pipefail
          # The usual Mac download: open it and drag Lelvo onto the Applications shortcut next to it.
          STAGE=$(mktemp -d)
          ditto build/DerivedData/Build/Products/Release/Lelvo.app "$STAGE/Lelvo.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Lelvo -srcfolder "$STAGE" -ov -format UDZO build/Lelvo.dmg
          if [ -n "${MAC_SIGN_ID:-}" ]; then
            # The disk image gets its own signature and ticket, so it opens offline without a Gatekeeper prompt.
            codesign --timestamp --sign "$MAC_SIGN_ID" build/Lelvo.dmg
            xcrun notarytool submit build/Lelvo.dmg --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" \
              --issuer "$ASC_ISSUER_ID" --wait --timeout 60m --output-format json | tee "$RUNNER_TEMP/notary-dmg.json"
            [ "$(plutil -extract status raw "$RUNNER_TEMP/notary-dmg.json")" = Accepted ] \
              || { echo "::error::Apple did not accept Lelvo.dmg for notarization."; exit 1; }
            xcrun stapler staple build/Lelvo.dmg
            spctl -a -vv -t open --context context:primary-signature build/Lelvo.dmg
          fi
          shasum -a 256 build/Lelvo.dmg | tee build/Lelvo.dmg.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: lelvo-mac
          path: |
            build/Lelvo.dmg
            build/Lelvo-mac.zip
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          PRE=""; [ "${{ needs.plan.outputs.prerelease }}" = true ] && PRE="--prerelease"
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[].tagName | select(startswith("macos-v"))][0] // empty')
          START=""; [ -n "$LAST" ] && START="--notes-start-tag $LAST"
          if [ -n "${MAC_SIGN_ID:-}" ]; then
            OPEN="Signed and notarized by Apple, so it opens like any other app."
          else
            OPEN="This build isn't notarized: the first time, macOS blocks it. System Settings → Privacy & Security → Open Anyway."
          fi
          gh release create "$TAG" build/Lelvo.dmg build/Lelvo.dmg.sha256 build/Lelvo-mac.zip build/Lelvo-mac.zip.sha256 \
            --target "$GITHUB_SHA" $PRE $START --title "Lelvo for Mac $VERSION" --generate-notes \
            --notes "macOS 15 or later, Apple silicon and Intel. Open Lelvo.dmg and drag Lelvo to Applications (or unzip Lelvo-mac.zip). $OPEN Build ${{ needs.plan.outputs.build }}."
      - name: Remove signing keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/devid.p12"

  # The repository front page only lists a release that is not a pre-release. The per-app tags stay
  # pre-releases so automatic betas can still find the last ios-v / macos-v tag. This job is the one
  # people download. A beta fills that spot until the first stable vX.Y.Z; after that, betas stay
  # pre-releases and the stable page stays Latest.
  showcase:
    needs: [plan, ios, macos]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.ios.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: lelvo-*
          if-no-files-found: ignore
      - name: Publish the repository release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out
          # This run's own files keep this run's version, even if a newer release lands while we publish.
          BUILT_IOS=false
          BUILT_MAC=false
          [ -d dist/lelvo-ios ] && BUILT_IOS=true
          [ -d dist/lelvo-mac ] && BUILT_MAC=true
          cp dist/lelvo-ios/* out/ 2>/dev/null || true
          cp dist/lelvo-mac/* out/ 2>/dev/null || true
          latest_tag() {
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
              --jq "[.[].tagName | select(startswith(\"$1\"))][0] // empty"
          }
          IOS_TAG=$(latest_tag ios-v)
          MAC_TAG=$(latest_tag macos-v)
          AND_TAG=$(latest_tag android-v)
          # A run that built only one app still shows the other app's newest installer.
          if [ ! -f out/Lelvo.ipa ] && [ -n "$IOS_TAG" ]; then
            gh release download "$IOS_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Lelvo.ipa' --dir out
          fi
          if [ ! -f out/Lelvo.dmg ] && [ -n "$MAC_TAG" ]; then
            gh release download "$MAC_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Lelvo.dmg' --pattern 'Lelvo-mac.zip' --dir out
          fi
          if [ -n "$AND_TAG" ]; then
            gh release download "$AND_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir out
          fi
          FILES=()
          for f in out/Lelvo.ipa out/Lelvo.dmg out/Lelvo-mac.zip out/*.apk; do
            [ -f "$f" ] && FILES+=("$f")
          done
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::No installers to publish."; exit 1; }
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG already exists."; exit 1
          fi
          OPEN="macOS 15 or later."
          if [ -n "$MAC_TAG" ]; then
            MAC_BODY=$(gh release view "$MAC_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            if [[ "$MAC_BODY" == *"isn't notarized"* ]]; then
              OPEN="This build isn't notarized: the first time, macOS blocks it. System Settings → Privacy & Security → Open Anyway."
            else
              OPEN="Signed and notarized by Apple, so it opens like any other app. macOS 15 or later."
            fi
          fi
          {
            echo "Download the current builds from this page."
            echo
            if [ -f out/Lelvo.ipa ] && { [ "$BUILT_IOS" = true ] || [ -n "$IOS_TAG" ]; }; then
              if [ "$BUILT_IOS" = true ]; then IOS_VER=$VERSION; else IOS_VER=${IOS_TAG#ios-v}; fi
              echo "iPhone $IOS_VER: Lelvo.ipa. Unsigned, for sideloading (README → Install). iOS 17 or later."
              echo
            fi
            if [ -f out/Lelvo.dmg ] && { [ "$BUILT_MAC" = true ] || [ -n "$MAC_TAG" ]; }; then
              if [ "$BUILT_MAC" = true ]; then MAC_VER=$VERSION; else MAC_VER=${MAC_TAG#macos-v}; fi
              echo "Mac $MAC_VER: open Lelvo.dmg and drag Lelvo to Applications, or unzip Lelvo-mac.zip. $OPEN"
              echo
            fi
            if [ -n "$AND_TAG" ]; then
              APK_NAME=$(basename out/*.apk)
              AND_VER=${AND_TAG#android-v}
              LINE="Android $AND_VER: $APK_NAME. Android 10 or later."
              if [[ "$AND_VER" == *beta* ]]; then
                LINE="$LINE This beta only backs up a library named \"Android Test\". Other libraries can be viewed."
              fi
              echo "$LINE"
              echo
            fi
            echo "Checksums are on each app's own release."
          } > "$RUNNER_TEMP/notes.txt"
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq '[.[].tagName | select(test("^v[0-9]"))][0] // empty')
          FLAGS=(--target "$GITHUB_SHA" --title "Lelvo $VERSION" --generate-notes --notes "$(cat "$RUNNER_TEMP/notes.txt")")
          [ -n "$LAST" ] && FLAGS+=(--notes-start-tag "$LAST")
          if [ "$PRE" = true ]; then
            HAS_STABLE=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease==false) | .tagName | select(test("^v[0-9]+\.[0-9]+\.[0-9]+$"))] | length')
            if [ "$HAS_STABLE" != "0" ]; then
              FLAGS+=(--prerelease)
            else
              # Two releases can finish out of order. The older one must not take the front page.
              MAX=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
                --jq '[.[] | select(.isPrerelease==false) | .tagName | capture("-beta\.(?<n>[0-9]+)$") | .n | tonumber] | max // 0')
              OUR=${VERSION##*.}
              if [ "$OUR" -ge "$MAX" ]; then FLAGS+=(--latest); else FLAGS+=(--latest=false); fi
            fi
          else
            FLAGS+=(--latest)
          fi
          gh release create "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" "${FLAGS[@]}"
          echo "Front page: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
