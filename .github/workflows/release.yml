name: Release

run-name: "${{ inputs.app }} ${{ inputs.version }} (${{ inputs.channel }}) #${{ github.run_number }}"

# Actions → Release → Run workflow. Pick the app, the channel and the version; everything else is automatic:
#   build number   = this workflow's run number (always increases, never collides)
#   beta version   = <version>-beta.<run number>, published as a pre-release
#   tag            = ios-v<version> / macos-v<version> (with the beta suffix for betas)
#   release notes  = merged pull requests since the last release, grouped by label (.github/release.yml)
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app
        type: choice
        options: [ios, macos, both]
        default: both
      channel:
        description: Release channel
        type: choice
        options: [beta, stable]
        default: beta
      version:
        description: "Version without suffix, e.g. 0.2.0"
        type: string
        required: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Release from main only (this run is on $GITHUB_REF)."; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 0.2.0, got '$VERSION'."; exit 1; }
          if [ "$CHANNEL" = beta ]; then FULL="$VERSION-beta.$GITHUB_RUN_NUMBER"; PRE=true; else FULL="$VERSION"; PRE=false; fi
          { echo "version=$FULL"; echo "build=$GITHUB_RUN_NUMBER"; echo "prerelease=$PRE"; } >> "$GITHUB_OUTPUT"
          echo "Releasing $FULL (build $GITHUB_RUN_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

  ios:
    needs: plan
    if: inputs.app == 'ios' || inputs.app == 'both'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 60
    env:
      TAG: ios-v${{ needs.plan.outputs.version }}
      # App Store Connect API key (docs/RELEASING.md → TestFlight). Without these the TestFlight step is skipped.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Refuse an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: "! gh release view \"$TAG\" --repo \"$GITHUB_REPOSITORY\" >/dev/null 2>&1 || { echo \"::error::$TAG already exists.\"; exit 1; }"
      - uses: ./.github/actions/setup
        with:
          td-api-id: ${{ secrets.TD_API_ID }}
          td-api-hash: ${{ secrets.TD_API_HASH }}
      - name: Archive (unsigned)
        run: |
          xcodebuild archive -project Memvo.xcodeproj -scheme Memvo -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Memvo.xcarchive \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ needs.plan.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/archive.log 2>&1 || { grep -E "error:" build/archive.log | head -50; tail -60 build/archive.log; exit 1; }
          grep -E "\*\* ARCHIVE" build/archive.log
      - name: Package Memvo.ipa
        run: |
          set -euo pipefail
          APP=build/Memvo.xcarchive/Products/Applications/Memvo.app
          test -f "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" -c "Print CFBundleVersion" "$APP/Info.plist"
          rm -rf build/Payload && mkdir -p build/Payload && cp -R "$APP" build/Payload/
          (cd build && zip -qry Memvo.ipa Payload)
          shasum -a 256 build/Memvo.ipa | tee build/Memvo.ipa.sha256
      - name: Upload to TestFlight
        if: env.ASC_KEY_ID != '' && env.APPLE_TEAM_ID != ''
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          # Xcode signs with the team's cloud-managed distribution certificate, using the API key.
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project Memvo.xcodeproj -scheme Memvo -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Memvo-signed.xcarchive \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ needs.plan.outputs.build }}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic "${AUTH[@]}" \
            > build/archive-signed.log 2>&1 || { grep -E "error:" build/archive-signed.log | head -50; tail -60 build/archive-signed.log; exit 1; }
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Memvo-signed.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export "${AUTH[@]}" \
            > build/upload.log 2>&1 || { grep -E "error:|Error" build/upload.log | head -50; tail -60 build/upload.log; exit 1; }
          echo "Uploaded build ${{ needs.plan.outputs.build }} to App Store Connect. It appears in TestFlight after Apple's processing (10-30 minutes)." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          PRE=""; [ "${{ needs.plan.outputs.prerelease }}" = true ] && PRE="--prerelease"
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[].tagName | select(startswith("ios-v"))][0] // empty')
          START=""; [ -n "$LAST" ] && START="--notes-start-tag $LAST"
          gh release create "$TAG" build/Memvo.ipa build/Memvo.ipa.sha256 --target "$GITHUB_SHA" $PRE $START \
            --title "Memvo for iPhone $VERSION" --generate-notes \
            --notes "Unsigned iOS build for sideloading (README → Install). iOS 17 or later. Build ${{ needs.plan.outputs.build }}."

  macos:
    needs: plan
    if: inputs.app == 'macos' || inputs.app == 'both'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 75
    env:
      TAG: macos-v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Refuse an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: "! gh release view \"$TAG\" --repo \"$GITHUB_REPOSITORY\" >/dev/null 2>&1 || { echo \"::error::$TAG already exists.\"; exit 1; }"
      - uses: ./.github/actions/setup
        with:
          td-api-id: ${{ secrets.TD_API_ID }}
          td-api-hash: ${{ secrets.TD_API_HASH }}
      - name: Build (Release, Apple silicon and Intel)
        run: |
          xcodebuild build -project Memvo.xcodeproj -scheme MemvoMac -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ needs.plan.outputs.build }}" \
            > build/mac.log 2>&1 || { grep -E "error:" build/mac.log | head -50; tail -60 build/mac.log; exit 1; }
          tail -1 build/mac.log
      - name: Package Memvo-mac.zip
        run: |
          set -euo pipefail
          APP=build/DerivedData/Build/Products/Release/Memvo.app
          test -f "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          lipo -archs "$APP/Contents/MacOS/Memvo"
          ditto -c -k --keepParent "$APP" build/Memvo-mac.zip
          shasum -a 256 build/Memvo-mac.zip | tee build/Memvo-mac.zip.sha256
      - name: Package Memvo.dmg
        run: |
          set -euo pipefail
          # The usual Mac download: open it and drag Memvo onto the Applications shortcut next to it.
          STAGE=$(mktemp -d)
          ditto build/DerivedData/Build/Products/Release/Memvo.app "$STAGE/Memvo.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Memvo -srcfolder "$STAGE" -ov -format UDZO build/Memvo.dmg
          shasum -a 256 build/Memvo.dmg | tee build/Memvo.dmg.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          PRE=""; [ "${{ needs.plan.outputs.prerelease }}" = true ] && PRE="--prerelease"
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[].tagName | select(startswith("macos-v"))][0] // empty')
          START=""; [ -n "$LAST" ] && START="--notes-start-tag $LAST"
          gh release create "$TAG" build/Memvo.dmg build/Memvo.dmg.sha256 build/Memvo-mac.zip build/Memvo-mac.zip.sha256 \
            --target "$GITHUB_SHA" $PRE $START --title "Memvo for Mac $VERSION" --generate-notes \
            --notes "macOS 15 or later, Apple silicon and Intel. Open Memvo.dmg and drag Memvo to Applications (or unzip Memvo-mac.zip). The first time, macOS blocks it because it isn't notarized yet: System Settings → Privacy & Security → Open Anyway. Build ${{ needs.plan.outputs.build }}."
