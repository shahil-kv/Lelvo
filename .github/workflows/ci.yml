name: CI

# Every pull request and push to main builds only what changed: Apple code → core tests, iOS and Mac builds and iOS
# tests; android/ → Android core tests and the Android build; docs and the website → no builds (just the website
# check). The test vectors are shared, so they run both. Skipped jobs still count as passed for required checks.
# Set the repository variable MACOS_RUNNER to use another macOS runner image (for example xcode-27).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      apple: ${{ steps.filter.outputs.apple == 'true' || steps.filter.outputs.apple_setup == 'true' || steps.filter.outputs.vectors == 'true' || steps.filter.outputs.ci == 'true' }}
      android: ${{ steps.filter.outputs.android == 'true' || steps.filter.outputs.android_setup == 'true' || steps.filter.outputs.vectors == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # `every`: a file counts for a filter only when it matches all of its patterns, so each filter has at most
          # one positive pattern (two would have to match the same file) plus exclusions.
          filters: |
            apple:
              - '!android/**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.github/**'
              - '!website/**'
              - '!wrangler.jsonc'
              - '!website-worker.js'
              - '!Scripts/waitlist.gs'
            android:
              - 'android/**'
              - '!android/**/*.md'
            android_setup:
              - '.github/actions/android/**'
            apple_setup:
              - '.github/actions/setup/**'
            vectors:
              - 'docs/test-vectors/**'
            ci:
              - '.github/workflows/ci.yml'
          predicate-quantifier: every
      - name: Website pages match their Markdown
        run: |
          python3 Scripts/website-pages.py
          git diff --exit-code -- website/ || { echo "::error::Run python3 Scripts/website-pages.py and commit the result."; exit 1; }

  core:
    name: Core unit tests
    needs: changes
    if: needs.changes.outputs.apple == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: swift test
        working-directory: Packages/LelvoCore
        run: swift test 2>&1 | tail -40

  # The Android app writes the same Telegram libraries, so its format and encryption code must pass the same test
  # vectors as the Swift core on every change. Pure JVM: no Android SDK or emulator needed.
  android-core:
    name: Android core unit tests
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: gradle test
        working-directory: android
        run: ./gradlew :core:test --no-daemon

  android-app:
    name: Android app build
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The first run builds TDLib (about 40 minutes); later runs restore it from the cache.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android
      - name: Build debug app, no Kotlin warnings
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug --no-daemon > ../build-android.log 2>&1 || { grep -E '^e: |What went wrong' -A6 ../build-android.log | head -60; tail -40 ../build-android.log; exit 1; }
          if grep -E '^w: ' ../build-android.log; then echo "::error::Kotlin warnings above"; exit 1; fi
          tail -2 ../build-android.log

  apps:
    name: iOS and Mac
    needs: changes
    if: needs.changes.outputs.apple == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    # Hosted macOS runners take about an hour for the UI tests (run twice on a failure); 75 minutes cut off the
    # Release build that comes after them.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build Mac app
        run: |
          xcodebuild build -project Lelvo.xcodeproj -scheme LelvoMac -configuration Debug \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO > build/mac.log 2>&1 || { grep -E "error:" build/mac.log | head -50; tail -40 build/mac.log; exit 1; }
          tail -1 build/mac.log

      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          SDKVER=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(xcrun simctl list devices available -j | SDKVER="$SDKVER" python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)["devices"]
          limit = tuple(int(p) for p in os.environ["SDKVER"].split("."))
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(p) for p in runtime.rsplit("iOS-", 1)[-1].split("-") if p.isdigit())
              if version[:2] > limit[:2]:
                  continue  # newer than this Xcode supports
              for d in devices:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      if best is None or version > best[0]:
                          best = (version, d["udid"], d["name"])
          print(best[1] if best else "")
          ')
          [ -n "$UDID" ] || { echo "No iPhone simulator found"; xcrun simctl list; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
          # Boot it now: a cold boot during the first UI test can time out the app launch on hosted runners.
          xcrun simctl bootstatus "$UDID" -b > /dev/null

      - name: Build and test iOS app (unit and UI tests)
        run: |
          xcodebuild test -project Lelvo.xcodeproj -scheme Lelvo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/TestResults.xcresult \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO > build/ios.log 2>&1 || { grep -E "error:|✘|failed" build/ios.log | head -100; tail -60 build/ios.log; exit 1; }
          grep -E "✔ Test run|Executed|\*\* TEST" build/ios.log || tail -20 build/ios.log

      - name: Build iOS app (Release)
        run: |
          xcodebuild build -project Lelvo.xcodeproj -scheme Lelvo -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO > build/ios-release.log 2>&1 || { grep -E "error:" build/ios-release.log | head -50; tail -40 build/ios-release.log; exit 1; }
          tail -1 build/ios-release.log

      - name: No compiler warnings in our code
        run: Scripts/check-warnings.sh build/mac.log build/ios.log build/ios-release.log

      - name: Upload logs and test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs
          path: |
            build/*.log
            build/TestResults.xcresult
          if-no-files-found: ignore
