name: Release iOS

# Push a tag like ios-v2.1.0 (or ios-v2.1.0-beta.1 for a pre-release) to publish an unsigned IPA on GitHub Releases.
on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          td-api-id: ${{ secrets.TD_API_ID }}
          td-api-hash: ${{ secrets.TD_API_HASH }}

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(xcodebuild -showBuildSettings -project CloudGallery.xcodeproj -scheme CloudGallery -configuration Release 2>/dev/null \
            | sed -nE 's/^ *MARKETING_VERSION = (.+)$/\1/p' | head -1)
          TAG="${GITHUB_REF_NAME#ios-v}"
          [ "${TAG%%-*}" = "$VERSION" ] || { echo "Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $VERSION"; exit 1; }

      - name: Archive (unsigned)
        run: |
          xcodebuild archive -project CloudGallery.xcodeproj -scheme CloudGallery -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/CloudGallery.xcarchive \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/archive.log 2>&1 || { grep -E "error:" build/archive.log | head -50; tail -60 build/archive.log; exit 1; }
          grep -E "\*\* ARCHIVE" build/archive.log

      - name: Package CloudGallery.ipa
        run: |
          set -euo pipefail
          APP=build/CloudGallery.xcarchive/Products/Applications/CloudGallery.app
          test -f "$APP/PrivacyInfo.xcprivacy"
          rm -rf build/Payload && mkdir -p build/Payload && cp -R "$APP" build/Payload/
          (cd build && zip -qry CloudGallery.ipa Payload)
          shasum -a 256 build/CloudGallery.ipa | tee build/CloudGallery.ipa.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: CloudGallery-ipa
          path: build/CloudGallery.ipa*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          NOTES="Unsigned iOS build. Install it with SideStore, AltStore or Sideloadly (README → Install). Requires iOS 17 or later. Changes: docs/CHANGELOG.md."
          gh release create "$GITHUB_REF_NAME" build/CloudGallery.ipa build/CloudGallery.ipa.sha256 $PRE \
            --title "CloudGallery for iPhone ${GITHUB_REF_NAME#ios-v}" --notes "$NOTES" --generate-notes
