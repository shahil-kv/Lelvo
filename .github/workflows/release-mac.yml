name: Release Mac

# Push a tag like macos-v1.0.0 (or macos-v1.0.0-beta.1) to publish the Mac app as a zip on GitHub Releases.
# The app is signed ad hoc. Developer ID signing and notarization come with the paid Apple Developer account.
on:
  push:
    tags: ["macos-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          td-api-id: ${{ secrets.TD_API_ID }}
          td-api-hash: ${{ secrets.TD_API_HASH }}

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(xcodebuild -showBuildSettings -project CloudGallery.xcodeproj -scheme CloudGalleryMac -configuration Release 2>/dev/null \
            | sed -nE 's/^ *MARKETING_VERSION = (.+)$/\1/p' | head -1)
          TAG="${GITHUB_REF_NAME#macos-v}"
          [ "${TAG%%-*}" = "$VERSION" ] || { echo "Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $VERSION"; exit 1; }

      - name: Build (Release, Apple silicon and Intel)
        run: |
          xcodebuild build -project CloudGallery.xcodeproj -scheme CloudGalleryMac -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            > build/mac.log 2>&1 || { grep -E "error:" build/mac.log | head -50; tail -60 build/mac.log; exit 1; }
          tail -1 build/mac.log

      - name: Package CloudGallery-mac.zip
        run: |
          set -euo pipefail
          APP=build/DerivedData/Build/Products/Release/CloudGallery.app
          test -f "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          lipo -archs "$APP/Contents/MacOS/CloudGallery"
          ditto -c -k --keepParent "$APP" build/CloudGallery-mac.zip
          shasum -a 256 build/CloudGallery-mac.zip | tee build/CloudGallery-mac.zip.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: CloudGallery-mac
          path: build/CloudGallery-mac.zip*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          NOTES="Mac app for macOS 15 or later, Apple silicon and Intel. Unzip, move to Applications, then right-click → Open the first time (README → Install). Changes: docs/CHANGELOG.md."
          gh release create "$GITHUB_REF_NAME" build/CloudGallery-mac.zip build/CloudGallery-mac.zip.sha256 $PRE \
            --title "CloudGallery for Mac ${GITHUB_REF_NAME#macos-v}" --notes "$NOTES" --generate-notes
