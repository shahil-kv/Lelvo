name: Set up the Android build
description: JDK 17, NDK and CMake, TDLib built once and cached, optional Telegram app keys in local.properties.
inputs:
  td-api-id:
    description: Telegram api_id to build into the app (optional; forks build without it).
    required: false
  td-api-hash:
    description: Telegram api_hash to build into the app (optional).
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    # TDLib isn't in git (36 MB of native code). It changes only with the TD commit in the script, so it is built
    # once (about 40 minutes) and then restored from the cache.
    - name: Restore TDLib
      id: tdlib
      uses: actions/cache@v4
      with:
        path: |
          android/telegram/src/main/jniLibs
          android/telegram/src/main/java/org/drinkless
        key: tdlib-android-${{ runner.os }}-${{ hashFiles('android/Scripts/build-tdlib.sh') }}

    - name: Build TDLib
      if: steps.tdlib.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq gperf php-cli > /dev/null
        NDK=$(grep -E '^NDK_VERSION=' android/Scripts/build-tdlib.sh | cut -d= -f2)
        # `yes` is cut off with a broken pipe once sdkmanager has its answers; under pipefail that failed the step.
        { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" "cmake;3.22.1" > /dev/null
        android/Scripts/build-tdlib.sh > build-tdlib.log 2>&1 || { tail -80 build-tdlib.log; exit 1; }
        tail -1 build-tdlib.log

    - name: local.properties
      shell: bash
      env:
        TD_API_ID: ${{ inputs.td-api-id }}
        TD_API_HASH: ${{ inputs.td-api-hash }}
      run: |
        set -euo pipefail
        {
          echo "sdk.dir=$ANDROID_HOME"
          if [ -n "$TD_API_ID" ] && [ -n "$TD_API_HASH" ]; then
            echo "telegram.apiId=$TD_API_ID"
            echo "telegram.apiHash=$TD_API_HASH"
          fi
        } > android/local.properties
