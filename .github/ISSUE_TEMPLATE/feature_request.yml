name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Please check [what's not planned](https://github.com/shahil-kv/Memvo/blob/main/docs/not-planned.md)
        first: requests on that list are closed.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you suggest
      options:
        - label: I searched open and closed issues and it isn't there.
          required: true
        - label: It isn't on the not-planned list.
          required: true
  - type: dropdown
    id: app
    attributes:
      label: App
      multiple: true
      options: [iPhone, iPad, Mac]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation, not only the solution. "When I…, I can't…".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Mock-ups and examples from other apps (Photos, Google Photos) help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      description: Ticking this isn't permission to start. Wait for the `approved` label; see CONTRIBUTING.md.
      options:
        - label: I'd like to build this myself once the issue is approved.
