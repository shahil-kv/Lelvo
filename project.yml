# XcodeGen spec for both apps. Generate the project with `xcodegen generate` (the .xcodeproj is not committed).
#   iOS/       iPhone and iPad app only
#   macOS/     Mac app only
#   Shared/    code both apps compile
#   Packages/  LelvoCore (format, crypto, index, queue) with its unit tests
name: Lelvo
options:
  bundleIdPrefix: com.shahil-kv
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Local builds only. Releases set both from the Release workflow (version you enter, build = run number).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  LelvoCore:
    path: Packages/LelvoCore
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    exactVersion: 1.5.2-tdlib-1.8.68-18c8f7a0

targets:
  Lelvo:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: iOS
        excludes: [DemoLibrary]
      # App Review demo library (DemoMode), bundled as one folder.
      - path: iOS/DemoLibrary
        type: folder
      - path: Shared
    dependencies:
      - package: LelvoCore
      - package: TDLibKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahil-kv.lelvo
        PRODUCT_NAME: Lelvo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOS/Resources/Info.plist
        SUPPORTS_MACCATALYST: NO
    info:
      path: iOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: Lelvo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        TDAPIId: $(TD_API_ID)
        TDAPIHash: $(TD_API_HASH)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: Lelvo backs up your photos and videos to your own private Telegram channel and shows them in one timeline.
        NSPhotoLibraryAddUsageDescription: Lelvo saves photos you download from your Telegram backup back into your library.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.shahil-kv.lelvo.backup.processing
          - com.shahil-kv.lelvo.index.refresh
          - com.shahil-kv.lelvo.backup.continued
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false

  LelvoMac:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: macOS
      - path: Shared
    dependencies:
      - package: LelvoCore
      - package: TDLibKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahil-kv.lelvo.mac
        PRODUCT_NAME: Lelvo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/LelvoMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Lelvo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        TDAPIId: $(TD_API_ID)
        TDAPIHash: $(TD_API_HASH)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Lelvo contributors. Free software under the GPL-3.0."
        NSPhotoLibraryUsageDescription: Lelvo backs up the photos and videos in your Photos library to your own private Telegram channel and shows them in one timeline.
        NSPhotoLibraryAddUsageDescription: Lelvo saves photos you download from your Telegram backup back into your Photos library.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: macOS/LelvoMac.entitlements
      properties:
        com.apple.security.personal-information.photos-library: true
        com.apple.security.network.client: true

  LelvoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/LelvoCore/Tests/LelvoCoreTests
    dependencies:
      - package: LelvoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahil-kv.lelvo.tests
        GENERATE_INFOPLIST_FILE: YES

  LelvoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Lelvo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahil-kv.lelvo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lelvo

schemes:
  LelvoMac:
    build:
      targets:
        LelvoMac: all
    run:
      config: Debug
    archive:
      config: Release
  Lelvo:
    build:
      targets:
        Lelvo: all
        LelvoTests: [test]
        LelvoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LelvoTests
        - LelvoUITests
    archive:
      config: Release
