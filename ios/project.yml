name: CloudGallery
options:
  bundleIdPrefix: com.shahil-kv
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  CloudGalleryCore:
    path: CloudGalleryCore
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    exactVersion: 1.5.2-tdlib-1.8.68-18c8f7a0

targets:
  CloudGallery:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: CloudGallery
    dependencies:
      - package: CloudGalleryCore
      - package: TDLibKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahil-kv.cloudgallery
        PRODUCT_NAME: CloudGallery
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CloudGallery/Resources/Info.plist
        SUPPORTS_MACCATALYST: NO
    info:
      path: CloudGallery/Resources/Info.plist
      properties:
        CFBundleDisplayName: CloudGallery
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        TDAPIId: $(TD_API_ID)
        TDAPIHash: $(TD_API_HASH)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: CloudGallery backs up your photos and videos to your own private Telegram channel and shows them in one timeline.
        NSPhotoLibraryAddUsageDescription: CloudGallery saves photos you download from your Telegram backup back into your library.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.shahil-kv.cloudgallery.backup.processing
          - com.shahil-kv.cloudgallery.index.refresh
          - com.shahil-kv.cloudgallery.backup.continued
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false

  CloudGalleryMac:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: CloudGalleryMac
      - path: CloudGallery/Shared
      - path: CloudGallery/App/AppEnvironment.swift
      - path: CloudGallery/App/AppModel.swift
      - path: CloudGallery/Services
      - path: CloudGallery/Views/Components/Components.swift
      - path: CloudGallery/Views/Onboarding/OnboardingView.swift
      - path: CloudGallery/Views/Settings/SettingsView.swift
      - path: CloudGallery/Views/Backup/BackupDashboardView.swift
      - path: CloudGallery/Views/Backup/FreeUpSpaceView.swift
      - path: CloudGallery/Views/Gallery/GalleryModel.swift
      - path: CloudGallery/Views/Gallery/GalleryActions.swift
    dependencies:
      - package: CloudGalleryCore
      - package: TDLibKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahil-kv.cloudgallery.mac
        PRODUCT_NAME: CloudGallery
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CloudGalleryMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: CloudGalleryMac/CloudGalleryMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: CloudGalleryMac/Info.plist
      properties:
        CFBundleDisplayName: CloudGallery
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        TDAPIId: $(TD_API_ID)
        TDAPIHash: $(TD_API_HASH)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "GPL-3.0. Your photos, your Telegram."
        NSPhotoLibraryUsageDescription: CloudGallery backs up the photos and videos in your Photos library to your own private Telegram channel and shows them in one timeline.
        NSPhotoLibraryAddUsageDescription: CloudGallery saves photos you download from your Telegram backup back into your Photos library.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: CloudGalleryMac/CloudGalleryMac.entitlements
      properties:
        com.apple.security.personal-information.photos-library: true
        com.apple.security.network.client: true

  CloudGalleryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CloudGalleryCore/Tests/CloudGalleryCoreTests
    dependencies:
      - package: CloudGalleryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahil-kv.cloudgallery.tests
        GENERATE_INFOPLIST_FILE: YES

  CloudGalleryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CloudGalleryUITests
    dependencies:
      - target: CloudGallery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahil-kv.cloudgallery.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CloudGallery

schemes:
  CloudGalleryMac:
    build:
      targets:
        CloudGalleryMac: all
    run:
      config: Debug
    archive:
      config: Release
  CloudGallery:
    build:
      targets:
        CloudGallery: all
        CloudGalleryTests: [test]
        CloudGalleryUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CloudGalleryTests
        - CloudGalleryUITests
    archive:
      config: Release
